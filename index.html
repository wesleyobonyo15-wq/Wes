<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Oil Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fdf6f0;
        }

        header {
            background-color: #ffb6c1;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
        }

        .product {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .product img {
            width: 300px;
            height: auto;
            border-radius: 10px;
        }

        .price {
            font-size: 24px;
            color: green;
            font-weight: bold;
        }

        button {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff1493;
        }

        footer {
            background-color: #ffb6c1;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Pure Baby Oil</h1>
        <p>Gentle Care for Your Baby's Skin</p>
    </header>

    <div class="container">
        <div class="product">
            <img src="Babyoil.jpg.jpg" alt="Baby Oil">
            <h2>Natural Baby Oil</h2>
            <p>
                Keep your baby's skin soft, smooth, and moisturized with our
                premium baby oil made from gentle ingredients.
            </p>
            <p class="price">KSh 500</p>
            <button>Buy Now</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Baby Oil Store. All Rights Reserved.</p>
    </footer>

</body>
</html>
